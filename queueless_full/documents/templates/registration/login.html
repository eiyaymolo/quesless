{% extends "documents/base.html" %}
{% block content %}
<div class="center card">
  <h2>👋 Welcome back!</h2>
  <p class="sub">Log in to see your requests.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Log in</button></form>
  <p class="muted" style="margin-top:16px">New here? <a href="{% url 'register' %}">Create a free account</a></p>
</div>
{% endblock %}
