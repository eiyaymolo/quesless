{% extends "documents/base.html" %}
{% block content %}
<div class="center card">
  <h2>👋 Welcome! Let's get you started</h2>
  <p class="sub">Free and takes less than a minute.</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Create my account 🚀</button></form>
  <p class="muted" style="margin-top:16px">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
